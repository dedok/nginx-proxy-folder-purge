#
# The tested nginx of t/test_foreground_purge.py.
#
# t/harness.py starts a copy for every test with these placeholders filled in:
#   @NGINX_PORT@    port of this nginx
#   @ORIGIN_PORT@   port of t/origin.py
#   @SANDBOX@       the per-test directory, it is the nginx prefix as well
#   @LOG_LEVEL@     error_log level, see NFP_LOG_LEVEL
#   @MAX_MASKS@     max_allowed_masks_per_domain, 1000 unless a test needs less
#

worker_processes 1;

error_log logs/error.log @LOG_LEVEL@;

pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # The background purger is off, so masks stay in the shared memory (and
    # on the disk) until they are flushed: purging is done by the foreground
    # purge only. Masks are stored in <path>/masks_storage/, the module
    # appends that directory name itself.
    folder_purge 100m @MAX_MASKS@ @SANDBOX@ purger_off;

    upstream origin {
        server 127.0.0.1:@ORIGIN_PORT@;
    }

    proxy_cache_path @SANDBOX@/cache levels=1:2 keys_zone=c:10m
                     max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 127.0.0.1:@NGINX_PORT@;
        server_name purge_folder;

        proxy_folder_purge on;
        proxy_folder_purge_cache_path cache;
        proxy_cache c;
        proxy_cache_valid 200 10m;
        proxy_cache_key $host:$uri;
        add_header X-Cache-Status $upstream_cache_status always;

        # The foreground purge is off here: cached objects are served
        # whatever the masks say.
        location /off/ {
            proxy_folder_purge_on_request off;
            proxy_pass http://origin;
        }

        location / {
            proxy_pass http://origin;
        }
    }
}

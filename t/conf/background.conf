#
# (C) BSD, Vas Soshnikov
#
# The nginx configuration of t/test_background_purge.py.
#
# The placeholders are the same as in foreground.conf, plus these:
#   @MASKS_DIR@       the directory the masks storage is in. It is @SANDBOX@,
#                     unless a test starts one more nginx that has to share
#                     the masks
#   @CACHE_INACTIVE@  inactive= of the cache zones
#   @OFC_VALID@       open_file_cache_valid of the /ofc/ location
#   @PURGER_FILES@, @PURGER_SLEEP@, @PURGER_THRESHOLD@, @PURGER_POLL@,
#   @LOCK_WAIT@       the options of folder_purge, a test makes the purge
#                     slow with them
#

worker_processes 1;

error_log logs/error.log @LOG_LEVEL@;

pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # The background purge is done by nginx's cache manager process. While
    # there is something to purge it is called again after purger_sleep, and
    # when it has nothing to do it looks for new masks every purger_poll.
    folder_purge 100m @MAX_MASKS@ @MASKS_DIR@
        purger_files=@PURGER_FILES@
        purger_sleep=@PURGER_SLEEP@
        purger_threshold=@PURGER_THRESHOLD@
        purger_poll=@PURGER_POLL@
        startup_lock_delay=@LOCK_WAIT@;

    upstream origin {
        server 127.0.0.1:@ORIGIN_PORT@;
    }

    proxy_cache_path @SANDBOX@/cache levels=1:2 keys_zone=c:10m
                     max_size=1g inactive=@CACHE_INACTIVE@ use_temp_path=off;

    # A second cache zone: purges of the "cache" zone must never touch it.
    proxy_cache_path @SANDBOX@/other_cache levels=1:2 keys_zone=other:10m
                     max_size=1g inactive=@CACHE_INACTIVE@ use_temp_path=off;

    server {
        listen 127.0.0.1:@NGINX_PORT@;
        server_name purge_folder;

        proxy_folder_purge on;
        proxy_folder_purge_cache_path cache;
        proxy_cache c;
        proxy_cache_valid 200 10m;
        proxy_cache_key $host:$uri;
        add_header X-Cache-Status $upstream_cache_status always;

        # The foreground purge is off, so the tests observe what the
        # background purger deletes.
        proxy_folder_purge_on_request off;

        location / {
            proxy_pass http://origin;
        }

        # Both purges are on here: a request for a purged object is renewed
        # at once, it does not wait for the background purger.
        location /fg/ {
            proxy_folder_purge_on_request on;
            proxy_cache_bypass $folder_purge_bypass;
            proxy_pass http://origin;
        }

        # Objects of the second cache zone. A purge sent here belongs to that
        # zone instead of "cache".
        location /other/ {
            proxy_folder_purge_cache_path other_cache;
            proxy_cache other;
            proxy_pass http://origin;
        }

        # nginx keeps the files of this location open
        location /ofc/ {
            open_file_cache max=100 inactive=60s;
            open_file_cache_valid @OFC_VALID@;
            open_file_cache_min_uses 1;
            open_file_cache_events on;
            proxy_pass http://origin;
        }

        # The same with the variable in use: the module warns here unless
        # the event method of nginx notices deleted files
        location /events/ {
            proxy_folder_purge_on_request on;
            proxy_cache_bypass $folder_purge_bypass;
            open_file_cache max=100 inactive=60s;
            open_file_cache_valid 300s;
            open_file_cache_min_uses 1;
            open_file_cache_events on;
            proxy_pass http://origin;
        }

        # The same without open_file_cache_events: the module has to warn.
        location /noevents/ {
            proxy_folder_purge_on_request on;
            proxy_cache_bypass $folder_purge_bypass;
            open_file_cache max=100 inactive=60s;
            open_file_cache_valid 300s;
            open_file_cache_min_uses 1;
            proxy_pass http://origin;
        }

        # The cache key says nothing about the url: the purger can't tell
        # what the file is for and has to leave it alone.
        location /keyless/ {
            proxy_cache_key noslash;
            proxy_pass http://origin;
        }
    }
}

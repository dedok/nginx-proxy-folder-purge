# A demo of nginx-proxy-folder-purge: two origins and a caching proxy in
# front of them, all in one nginx. Nothing else is needed.
#
# Start it from the root of the repository. nginx stays in the foreground:
#
#     make
#     mkdir -p /tmp/fp-demo/logs
#     ./nginx/objs/nginx -p /tmp/fp-demo -c "$PWD/examples/nginx.conf"
#
# In another terminal, three requests fill the cache and the fourth one is
# served from it:
#
#     curl -sD- http://localhost:8082/folder/a   # X-Cache-Status: MISS
#     curl -sD- http://localhost:8082/folder/b   # MISS
#     curl -sD- http://localhost:8082/other/c    # MISS
#     curl -sD- http://localhost:8082/folder/a   # HIT
#
# Purge a folder and ask for its objects again. The quotes keep the shell
# from expanding the asterisk:
#
#     curl -sD- -XPURGE 'http://localhost:8082/folder/*'
#     curl -sD- http://localhost:8082/folder/b   # BYPASS: renewed at once
#     curl -sD- http://localhost:8082/other/c    # HIT: the mask is for /folder/
#
# The background purge removes the files of /folder/ from the cache, and its
# steps are in the log:
#
#     tail -n 20 /tmp/fp-demo/logs/error.log
#
# The active purges can be listed at any moment:
#
#     curl -s -XPURGE -H 'X-Purge-Options: dump' http://localhost:8082/

worker_processes  1;

# The demo stays in the foreground.
daemon            off;

# The paths are relative to the prefix of nginx, /tmp/fp-demo here.
error_log  logs/error.log  info;
pid        nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  text/plain;

    # The locations accept PURGE requests, and only the loopback may send
    # them. "on" is the PURGE method; the name of another method can stand
    # in its place.
    proxy_folder_purge  on  from  127.0.0.1;

    ## The origins. Each answers with a line of text.

    upstream cacheable_origin {
        server  127.0.0.1:8083;
        server  127.0.0.1:8084;
    }

    server {
        listen       8083;
        server_name  origin_8083;
        add_header   X-Origin  $server_name;
        return 200  'Some content from $server_name, request uri = $request_uri\n';
    }

    server {
        listen       8084;
        server_name  origin_8084;
        add_header   X-Origin  $server_name;
        return 200  'Some content from $server_name, request uri = $request_uri\n';
    }

    ## The cache.

    proxy_cache_path  cache  levels=1:2  keys_zone=c:10m  max_size=10g
                      inactive=60m  use_temp_path=off;

    ## The storage of the masks:
    ##
    ##   100m   the shared memory for the masks
    ##   30     the masks a hostname can have at the same time
    ##   .      the directory of the storage: its masks_storage subdirectory
    ##          is used
    ##
    ## The options of the background purge are left at their defaults.

    folder_purge  100m  30  .;

    ## The proxy.

    server {
        listen              8082;
        server_name         purge_folder;

        proxy_cache         c;
        proxy_cache_valid   200  10m;

        # The purges read the hostname and the url out of the cache key.
        # Keep the key in this form: the hostname, a colon, the uri. The
        # keys the module reads are listed in the README.
        proxy_cache_key     $host:$uri;

        # The background purge removes the files of the cache directory
        # with this name. It is the directory of the proxy_cache_path
        # above. Without this directive the background purge has no cache
        # to remove the files from.
        proxy_folder_purge_cache_path  cache;

        location / {
            # The foreground purge: a purged object asked for while its
            # mask is active is not taken from the cache.
            proxy_cache_bypass  $folder_purge_bypass;

            add_header  X-Cache-Status  $upstream_cache_status  always;

            proxy_pass  http://cacheable_origin;
        }
    }
}
